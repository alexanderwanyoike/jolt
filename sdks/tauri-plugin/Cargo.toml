[package]
name = "tauri-plugin-jolt"
version = "0.1.0"
description = "Tauri plugin exposing the local Jolt daemon to app webviews through audited proxy commands"
edition = "2021"
license = "MIT"
repository = "https://github.com/alexanderwanyoike/jolt"
links = "tauri-plugin-jolt"

[dependencies]
tauri = { version = "2" }
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
