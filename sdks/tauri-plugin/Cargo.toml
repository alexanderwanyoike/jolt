[package]
name = "tauri-plugin-jolt"
version = "0.1.1"
description = "Tauri plugin exposing the local Jolt daemon to app webviews through audited proxy commands"
edition = "2021"
license = "MIT"
repository = "https://github.com/alexanderwanyoike/jolt"
links = "tauri-plugin-jolt"
readme = "README.md"
keywords = ["tauri", "plugin", "jolt", "p2p"]
categories = ["gui", "network-programming"]

[dependencies]
tauri = { version = "2" }
# The plugin only proxies to the daemon's loopback HTTP endpoint.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
