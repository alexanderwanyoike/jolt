[workspace]
resolver = "2"
members = [
    "crates/jolt-core",
    "crates/jolt-identity",
    "crates/jolt-store",
    "crates/jolt-network",
    "crates/jolt-server",
    "crates/jolt-node",
    "apps/jolt-console/src-tauri",
]

[workspace.package]
version = "0.3.11"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal crates
jolt-core = { path = "crates/jolt-core" }
jolt-identity = { path = "crates/jolt-identity" }
jolt-store = { path = "crates/jolt-store" }
jolt-network = { path = "crates/jolt-network" }
jolt-server = { path = "crates/jolt-server" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# P2P networking
libp2p = { version = "0.56", features = [
    "tokio",
    "noise",
    "yamux",
    "tcp",
    "mdns",
    "request-response",
    "cbor",
    "macros",
    "identify",
    "kad",
] }
libp2p-iroh = { git = "https://github.com/alexanderwanyoike/libp2p-iroh.git", branch = "main" }
iroh = "0.97"

# Cryptography
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
rand_core = { version = "0.9", features = ["os_rng"] }

# Content addressing
blake3 = "1"
cid = "0.11"
multihash = "0.19"
multihash-codetable = { version = "0.1", features = ["blake3"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP server
axum = "0.8"
axum-extra = { version = "0.10", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

# Misc
directories = "5"
hex = "0.4"
data-encoding = "2"
tempfile = "3"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
