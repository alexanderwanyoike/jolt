[workspace]
resolver = "2"
members = [
    "crates/dweb-core",
    "crates/dweb-identity",
    "crates/dweb-store",
    "crates/dweb-network",
    "crates/dweb-server",
    "crates/dweb-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal crates
dweb-core = { path = "crates/dweb-core" }
dweb-identity = { path = "crates/dweb-identity" }
dweb-store = { path = "crates/dweb-store" }
dweb-network = { path = "crates/dweb-network" }
dweb-server = { path = "crates/dweb-server" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# P2P networking
libp2p = { version = "0.56", features = [
    "tokio",
    "noise",
    "yamux",
    "mdns",
    "request-response",
    "cbor",
    "macros",
    "identify",
    "kad",
] }
libp2p-iroh = "0.1"
iroh = "0.97"

# Cryptography
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
rand = "0.8"

# Content addressing
blake3 = "1"
cid = "0.11"
multihash = "0.19"
multihash-codetable = { version = "0.1", features = ["blake3"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP server
axum = "0.8"
axum-extra = { version = "0.10", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

# Misc
directories = "5"
hex = "0.4"
tempfile = "3"
