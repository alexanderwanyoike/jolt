name: Package Jolt Console

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/package-jolt-console.yml"
      - "apps/jolt-console/**"
      - "crates/**"
      - "sdks/**"
      - "scripts/package-jolt-console.sh"
      - "scripts/normalize-jolt-console-artifacts.sh"
      - "scripts/assemble-jolt-console-release.sh"
      - "scripts/install-jolt-console.sh"
      - "scripts/verify-distribution.mjs"
      - "scripts/write-jolt-console-update-manifest.mjs"
      - "Cargo.lock"
      - "Cargo.toml"
  push:
    branches:
      - dev
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AppImage and deb
            runner: ubuntu-22.04
            platform: linux-x86_64
            bundle: linux
            artifact_name: jolt-console-linux-x86_64
            console_asset: jolt-console-x86_64.AppImage
            updater_asset: jolt-console-x86_64.AppImage
            deb_asset: jolt-console-amd64.deb
            cli_asset: jolt-linux-x86_64
            cli_source: target/release/jolt
          - name: macOS DMG
            runner: macos-latest
            platform: darwin-aarch64
            bundle: dmg
            artifact_name: jolt-console-macos-aarch64
            console_asset: jolt-console-aarch64.dmg
            updater_asset: jolt-console-aarch64.app.tar.gz
            cli_asset: jolt-macos-aarch64
            cli_source: target/release/jolt
          - name: Windows NSIS
            runner: windows-latest
            platform: windows-x86_64
            bundle: nsis
            artifact_name: jolt-console-windows-x86_64
            console_asset: jolt-console-x86_64-setup.exe
            updater_asset: jolt-console-x86_64-setup.exe
            cli_asset: jolt-windows-x86_64.exe
            cli_source: target/release/jolt.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/jolt-console/package-lock.json

      - name: Verify distribution contract
        run: node scripts/verify-distribution.mjs

      - name: Install Linux desktop packaging dependencies
        if: matrix.bundle == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build native package
        shell: bash
        env:
          JOLT_BUNDLE_KIND: ${{ matrix.bundle }}
          JOLT_CREATE_UPDATER_ARTIFACTS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/package-jolt-console.sh --bundle "${{ matrix.bundle }}"

      - name: Normalize artifact names
        shell: bash
        env:
          JOLT_REQUIRE_UPDATER_ARTIFACTS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
        run: |
          scripts/normalize-jolt-console-artifacts.sh \
            --bundle "${{ matrix.bundle }}" \
            --dist-dir "dist/${{ matrix.artifact_name }}" \
            --console-asset "${{ matrix.console_asset }}" \
            --updater-asset "${{ matrix.updater_asset }}" \
            --cli-asset "${{ matrix.cli_asset }}" \
            --cli-source "${{ matrix.cli_source }}" \
            --deb-asset "${{ matrix.deb_asset || '' }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}/*
          if-no-files-found: error

  release:
    name: Publish release assets
    runs-on: ubuntu-22.04
    needs: package
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble release assets
        run: scripts/assemble-jolt-console-release.sh --tag "$GITHUB_REF_NAME"

      # The JS SDK ships as a release tarball so applications can depend on it
      # without a registry: yarn add <release>/jolt-sdk.tgz (sdks/js/README.md).
      - name: Build and pack the JS SDK
        run: |
          cd sdks/js
          yarn install --frozen-lockfile
          yarn test
          yarn build
          yarn pack --filename ../../release/jolt-sdk.tgz

      - name: Upload combined release artifact
        uses: actions/upload-artifact@v4
        with:
          name: jolt-console-release-assets
          path: release/*
          if-no-files-found: error

      - name: Publish release assets for tags
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
